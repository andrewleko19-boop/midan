<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مِيدان · midan — استكشاف الشعار النصي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600&display=swap">
<style>
:root{--ink:#1d1b18;--mu:#6a645a;--ln:#ddd6c8;--bg:#f7f4ed;--sf:#fff;--ac:#1f5fa8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Readex Pro',system-ui,sans-serif;line-height:1.7;font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}a{color:inherit}
:focus-visible{outline:3px solid #d9791f;outline-offset:2px}
.bar{position:sticky;top:0;z-index:10;background:rgba(247,244,237,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--ln);padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.b{min-height:40px;padding:0 14px;border:1px solid var(--ln);border-radius:10px;background:var(--sf)}.b.p{background:var(--ink);color:#fff;border-color:var(--ink)}.b.on{background:var(--ink);color:#fff}.b:disabled{opacity:.4;cursor:not-allowed}
.tag{font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid var(--ln);background:#fff;white-space:nowrap}.rec{background:#e6f3ea;border-color:#9bcaa8;color:#16502b}.alt{background:#e7eef9;border-color:#a9c0e4;color:#1d3f75}.exp{background:#fbf0d9;border-color:#e3c887;color:#6a4a07}.rsk{background:#fbe6e1;border-color:#e6a99b;color:#7a2514}.cur{background:#eee;color:#333}
.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 80px}h1{font-size:30px;margin:6px 0}h2{font-size:21px;margin:26px 0 8px}h3{font-size:16px;margin:0 0 6px}.mu{color:var(--mu);font-size:13.5px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px}
.stage{display:grid;place-items:center;border-radius:12px;padding:22px;min-height:150px;overflow:hidden}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}.tbl td,.tbl th{padding:8px 10px;border-bottom:1px solid var(--ln);text-align:right;vertical-align:top}
.sw{width:100%;height:34px;border-radius:8px;border:1px solid rgba(0,0,0,.12)}.cols{display:grid;gap:14px;grid-template-columns:1fr 1fr}@media(max-width:760px){.cols{grid-template-columns:1fr}}
ul.l{margin:6px 0;padding-inline-start:20px}ul.l li{margin:3px 0}.note{background:#fff8e8;border:1px dashed #e0c27a;border-radius:10px;padding:8px 12px;font-size:13px}
/* mockups */
.pg{width:min(380px,100%);height:538px;background:#fff;border:1px solid #d9d4c8;box-shadow:0 8px 24px rgba(0,0,0,.1);padding:24px 26px 34px;display:flex;flex-direction:column;gap:9px;font-size:9.6px;line-height:1.75;color:#222;position:relative;overflow:hidden;flex:none;direction:rtl}
.hd{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1.5px solid var(--p,#222);padding-bottom:9px}.hd .cd{text-align:left;font-size:8.5px;color:#555;direction:ltr}
.ft{position:absolute;bottom:10px;left:26px;right:26px;display:flex;justify-content:space-between;font-size:8px;color:#777;border-top:1px solid #e3dfd5;padding-top:5px}
.ln{height:5px;background:#e6e2d9;border-radius:3px}.mt{display:grid;grid-template-columns:70px 1fr;gap:3px 8px;font-size:9.2px}.mt b{color:#555;font-weight:500}
.t9{width:100%;border-collapse:collapse;font-size:8.8px}.t9 th{background:var(--p,#222);color:var(--pt,#fff);padding:4px 6px;text-align:right;font-weight:500}.t9 td{padding:4px 6px;border-bottom:1px solid #e3dfd5}
.bdg{display:inline-block;border:1px solid var(--p,#222);color:var(--p,#222);border-radius:99px;padding:0 8px;font-size:8.5px}.sig{margin-top:auto;display:flex;gap:30px}.sig div{flex:1;border-top:1px solid #888;padding-top:3px;font-size:8.5px;color:#555}
.pb{height:7px;background:#e6e2d9;border-radius:4px;overflow:hidden}.pb i{display:block;height:100%;background:var(--s,#555)}
.dev{border-radius:26px;border:6px solid #1b1b1b;background:#fff;width:300px;height:560px;overflow:hidden;position:relative;flex:none;direction:rtl}
svg{max-width:100%;height:auto}.pg{max-width:100%}.web{border:1px solid var(--ln);border-radius:12px;overflow:hidden;background:#fff}

const S={v:'cover',wm:'V3',pal:1,cx:0,lab:'V3',dA:2,dE:0,layout:'ar',mono:false,bgv:'light'};
// ---------- wordmark rendering
function col(mode,P){return mode==='light'?{f:P.p,a:P.s}:mode==='dark'?{f:P.dt,a:P.ds}:mode==='monow'||mode==='navyr'?{f:'#fff',a:'#fff'}:mode==='navy'?{f:P.p,a:P.p}:{f:'#111',a:'#111'}}
function grp(it,lang,s,x,y0,c){const o=it[lang];return `<g transform="translate(${x},${y0}) scale(${s}) translate(0,${-o.b[1]})"><path d="${o.m}" fill="${c.f}"/><path d="${o.a}" fill="${c.a}"/></g>`}
function wm(id,kind,w,mode,P,ratio){P=P||PAL[S.pal];ratio=ratio||.6;const it=W[id],c=col(mode,P),ar=it.ar,en=it.en;
 if(kind==='ar'){const s=w/ar.b[2],h=(ar.b[3]-ar.b[1])*s;return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="مِيدان">${grp(it,'ar',s,0,0,c)}</svg>`}
 if(kind==='en'){const s=w/en.b[2],h=(en.b[3]-en.b[1])*s;return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="midan">${grp(it,'en',s,0,0,c)}</svg>`}
 const sA=w/ar.b[2],sE=sA*(ar.h*ratio/en.h),ah=(ar.b[3]-ar.b[1])*sA,ew=en.b[2]*sE,eh=(en.b[3]-en.b[1])*sE;
 if(kind==='pairE'){const g=eh*.28,Wt=Math.max(w,ew),Ht=eh+g+ah;return `<svg viewBox="0 0 ${Wt} ${Ht}" width="${Wt}" height="${Ht}" role="img" aria-label="Midan مِيدان">${grp(it,'en',sE,0,0,c)}${grp(it,'ar',sA,0,eh+g,c)}</svg>`}
 if(kind==='bi'){const gap=w*.14,H=Math.max(ah,eh),sE2=sA*(ar.h*.8/en.h),ew2=en.b[2]*sE2,eh2=(en.b[3]-en.b[1])*sE2,Hh=Math.max(ah,eh2),Wt=w+gap*2+ew2;
  const baseA=-ar.b[1]*sA,baseE=-en.b[1]*sE2,base=Math.max(baseA,baseE),HH=Math.max(base+ar.b[3]*sA,base+en.b[3]*sE2);
  return `<svg viewBox="0 0 ${Wt} ${HH}" width="${Wt}" height="${HH}" role="img" aria-label="مِيدان midan"><g transform="translate(${Wt-w},${base-baseA})"><g transform="translate(0,0)">${grp(it,'ar',sA,0,0,c)}</g></g><rect x="${ew2+gap-1}" y="${HH*.2}" width="2" height="${HH*.6}" fill="${c.f}" opacity=".35"/><g transform="translate(0,${base-baseE})">${grp(it,'en',sE2,0,0,c)}</g></svg>`}
 const g=ah*.2,Wt=Math.max(w,ew),Ht=ah+g+eh;
 return `<svg viewBox="0 0 ${Wt} ${Ht}" width="${Wt}" height="${Ht}" role="img" aria-label="مِيدان midan">${grp(it,'ar',sA,Wt-w,0,c)}${grp(it,'en',sE,Wt-ew,ah+g,c)}</svg>`}
const bgOf=(m,P)=>m==='light'?P.l:m==='dark'?P.d:m==='monow'?'#111':m==='navyr'?P.p:'#fff';
const tile=(id,kind,w,m,P)=>`<div class="stage" style="background:${bgOf(m,P||PAL[S.pal])}">${wm(id,kind,w,m,P)}</div>`;
const nameOf=id=>id[0]==='V'?VM[id].t+' · '+VM[id].e:(CM.find(c=>c.id===id)||{}).n+' · '+(CM.find(c=>c.id===id)||{}).e;
const STATUS=id=>id[0]==='V'?VM[id].st:CM.find(c=>c.id===id).st;
const tg=(st)=>`<span class="tag ${st[1]}">${st[0]}</span>`;

<h2>الوصف: البدائل والمبدئي</h2><div class="grid">${DA.map((a,i)=>`<div class="card"><div class="stage" style="background:${P.l};min-height:120px"><div style="text-align:center">${wm('fin','pair',200,'light',P)}<div style="margin-top:8px;font-size:12px;color:${P.p}">${a}</div><div dir="ltr" style="font-size:10.5px;color:${P.p};opacity:.75">${DE[i]}</div></div></div>${i===2?tg(['مبدئي · يُحتفظ به','rec']):''}</div>`).join('')}</div></div>`}finally{S.desc=k}};
V.f5=()=>{const P=FP();return `<div class="wrap"><h1>F5 · الأحجام والأحادي</h1><div class="grid">${['ar','en','pair'].map(k=>`<div class="card"><h3>${k==='ar'?'العربية':k==='en'?'Midan':'الزوج'}</h3>${[200,120,80,56,40,28].map(w=>`<div class="row" style="padding:5px 0;border-top:1px solid var(--ln)"><span class="mu" style="width:44px">${w}px</span>${wm('fin',k,w,'light',P)}<span style="margin-inline-start:14px">${wm('fin',k,w,'mono',P)}</span></div>`).join('')}</div>`).join('')}</div>
<h2>النسخ الأحادية</h2><div class="grid">${[['mono','أسود على أبيض — الرسمي للطباعة'],['monow','أبيض على أسود'],['navy','كحلي'],['navyr','أبيض على كحلي']].map(([m,l])=>`<div class="card">${tile('fin','pair',230,m,m.startsWith('navy')?{...P,p:'#0F1730'}:P)}<b style="font-size:13px">${l}</b></div>`).join('')}</div><p class="note">الكسرة ونقطة i تبقيان مقروءتين بلون واحد؛ الحد الأدنى: العربية 40px عرضًا، الزوج 120px.</p></div>`};
V.f6=()=>{const P=FP();return `<div class="wrap"><h1>F6 · التوصية النهائية</h1><div class="cols"><div class="card"><div class="stage" style="background:${PAL[1].l}">${wm('fin','pair',360,'light',P)}</div><div class="row" style="margin-top:8px">${tg(['موصى به','rec'])}<b>R2 + E2 + K2 + D2 · Midan</b></div></div><div class="card"><table class="tbl"><tr><td>الأقوى عربيًا</td><td><b>R2 · اتجاه</b></td></tr><tr><td>الأقوى إنجليزيًا</td><td><b>E2 · متوسطة</b> بحرف M كبير: Midan</td></tr><tr><td>الترتيب ثنائي اللغة</td><td><b>أ</b>: مِيدان فوق و<span dir="ltr">Midan</span> تحت (RTL)</td></tr><tr><td>الكسرة + النقطة</td><td><b>K2 + D2</b>: معيّن مدوّر بطرف ناعم؛ الكسرة مائلة 12° والنقطة منتصبة</td></tr><tr><td>اللون</td><td><b>#0E3A5F</b> مع تمييز اختياري <b>#1F5FA8</b> (للكسرة والنقطة فقط)</td></tr><tr><td>الأحادي</td><td>أسود على أبيض للطباعة الرسمية؛ كحلي #0F1730 للشاشات</td></tr><tr><td>الوصف المبدئي</td><td>${DA[2]} · <span dir="ltr">${DE[0]}</span> — يُحتفظ به مؤقتًا مع بقاء البدائل</td></tr></table></div></div>
<h2>لماذا؟</h2><ul class="l"><li>R2 يجمع وضوح الميم وتجويفها الهندسي مع اتجاه خفيف في الدال دون تعقيد.</li><li>E2 + حرف M طباعي: قراءة طبيعية وسماكة متقاربة مع العربية.</li><li>الترتيب أ يجعل العربية القائدة في منتج عربي أولًا.</li><li>الأحادي يحتفظ بالكسرة والنقطة بلا حاجة للون.</li></ul>
<h2>المخاطر المتبقية</h2><ul class="l"><li>التفاصيل الصغيرة (التجويف المربّع، الكسرة، النقطة) تحتاج اختبار قراءة دون ≈ 24px.</li><li>أخفّ نقطة وكسرة بلون التمييز؛ يُنصح بقراءة حقيقية مع مستخدمين.</li><li>لم يُجرَ فحص توفر الاسم أو العلامة التجارية ولا يُدّعى أنه فريد.</li></ul><p class="note">اقتصر الفحص على عروض ثابتة في Chromium محليًا؛ لم تُفحص الصفحة المستضافة ولا متصفحات أخرى. الهوية الأصلية المعتمدة لم تتغير.</p></div>`};

// ---------- shell
function render(){const i=SEQ.findIndex(x=>x[0]===S.v),prev=SEQ[Math.max(0,i-1)],next=SEQ[Math.min(SEQ.length-1,i+1)];
 $('#app').innerHTML=`<div class="bar"><button class="b" data-go="toc">المحتويات</button><button class="b" data-go="${prev[0]}" ${i===0?'disabled':''}>السابق</button><button class="b p" data-go="${next[0]}" ${i===SEQ.length-1?'disabled':''}>التالي</button><b style="margin-inline-start:8px">${SEQ[i][1]}</b><span style="flex:1"></span><span class="tag">استكشاف شعار نصي فقط · لا رمز ولا أيقونة</span></div>${V[S.v]()}<div class="wrap" style="padding-top:0"><div class="row"><button class="b" data-go="toc">العودة إلى المحتويات</button><button class="b" data-go="${prev[0]}" ${i===0?'disabled':''}>السابق</button><button class="b p" data-go="${next[0]}" ${i===SEQ.length-1?'disabled':''}>التالي</button></div></div>`;window.scrollTo(0,0)}
function $(s){return document.querySelector(s)}
document.addEventListener('click',e=>{const pr=e.target.closest('[data-pair]');if(pr){const p=PAIR[pr.dataset.pair];S.rA=p[0];S.rK=p[1];S.rE=p[2];S.rD=p[3];const y=scrollY;render();scrollTo(0,y);return}const t=e.target.closest('[data-go],[data-set],[data-open]');if(!t)return;if(t.dataset.go){S.v=t.dataset.go;render()}else if(t.dataset.open){S.cx=CM.findIndex(c=>c.id===t.dataset.open);S.v='s4';render()}else if(t.dataset.set&&t.tagName!=='INPUT'){const[k,v]=t.dataset.set.split('=');S[k]=(v==='true'?true:v==='false'?false:isNaN(v)||k==='wm'||k==='lab'||k==='layout'||k==='bgv'?v:+v);const y=window.scrollY;render();window.scrollTo(0,y)}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.set&&t.tagName==='INPUT'){const[k,v]=t.dataset.set.split('=');S[k]=+v;const y=scrollY;render();scrollTo(0,y)}else if(t.dataset.sel){S[t.dataset.sel]=(t.dataset.sel==='pal'||t.dataset.sel==='acc')?+t.value:t.value;const y=scrollY;render();scrollTo(0,y)}});
render();
</script></body></html>
